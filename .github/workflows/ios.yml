name: iOS

on:
  push:
    paths-ignore: ["docs/**", "scripts/**", "README.md", ".github/workflows/model-facts.yml", ".github/workflows/drafter-lab.yml"]
  pull_request:
    paths-ignore: ["docs/**", "scripts/**", "README.md", ".github/workflows/model-facts.yml", ".github/workflows/drafter-lab.yml"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test AssistantKit and build the app
    # MLX needs Swift 6.3 (Xcode 26.4+) and the Metal Toolchain.
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select the newest stable Xcode
        run: |
          latest=$(ls -d /Applications/Xcode_[0-9]*.app | grep -viE 'beta|rc' | sort -V | tail -1 || true)
          if [ -n "$latest" ]; then sudo xcode-select -s "$latest"; fi
          xcodebuild -version
          swift --version

      - name: Unit tests (AssistantKit)
        run: swift test --package-path AssistantKit

      - name: Unit tests (MiniCPM)
        run: swift test --package-path MiniCPM

      # VoiceKit is iOS only (audio session, UIKit), so its tests run on the first iPhone simulator this
      # Xcode offers.
      - name: Unit tests (VoiceKit)
        working-directory: VoiceKit
        run: |
          id=$(xcodebuild -showdestinations -scheme VoiceKit \
            | awk -F'id:' '/platform:iOS Simulator/ && /name:iPhone/ && !found { split($2, a, ","); print a[1]; found = 1 }')
          test -n "$id"
          xcodebuild test -quiet -scheme VoiceKit -destination "platform=iOS Simulator,id=$id" \
            -derivedDataPath ../build/VoiceKitDerivedData -skipPackagePluginValidation -skipMacroValidation

      # scripts/** is in paths-ignore, so these run with the code they check.
      - name: Script checks
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Install the Metal Toolchain
        run: |
          xcodebuild -showComponent MetalToolchain | grep -q "Status: installed" \
            || xcodebuild -downloadComponent MetalToolchain

      - name: Build the iOS app
        run: |
          set -o pipefail
          xcodebuild build \
            -quiet \
            -project AlvinAssistant.xcodeproj \
            -scheme AlvinAssistant \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO

  linux:
    name: AssistantKit on Linux
    runs-on: ubuntu-24.04
    container: swift:6.2-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path AssistantKit
